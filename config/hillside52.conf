# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display settings - DISABLED (no power to display by default)
CONFIG_ZMK_DISPLAY=n
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
# CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_DISPLAY_INVERT=n

# Display animations - DISABLED
# CONFIG_NICE_OLED_GEM_ANIMATION_MS=96000
# CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=30000
# CONFIG_NICE_OLED_POKEMON_ANIMATION=y
# CONFIG_NICE_OLED_WIDGET_WPM=n
# CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n

# LED/RGB settings - DISABLED (no power to LEDs by default)
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# External power control - defaults to OFF (can be toggled via keymap if needed)
# ext_power defaults to EP_OFF state on boot, ensuring no power to display/LEDs by default

# Power management - Deep sleep and idle states
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Deep sleep after 15 minutes of inactivity (disconnects BT, disables peripherals)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Idle state after 30 seconds of inactivity (disables display/lighting)

# Logging - DISABLED (reduces power consumption)
# Disable USB/UART console logging to save power
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n
# Reduce log levels to minimize power usage (if logging is needed)
# CONFIG_LOG_DEFAULT_LEVEL=0

CONFIG_ZMK_STUDIO_LOCKING=n

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Enable split keyboard battery reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
