# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display settings
CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
# CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=500
CONFIG_ZMK_DISPLAY_INVERT=n

# We need to enable Luna features for compilation to succeed
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y

# Animation timing values
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ANIMATION_MS=30000
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA_ANIMATION_MS=30000
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=30000
CONFIG_NICE_OLED_GEM_ANIMATION_MS=30000
CONFIG_NICE_OLED_POKEMON_ANIMATION_MS=30000

# Disable other animations
CONFIG_NICE_OLED_GEM_ANIMATION=n
CONFIG_NICE_OLED_POKEMON_ANIMATION=n
CONFIG_NICE_OLED_GEM_ANIMATION_SMART_BATTERY=n

CONFIG_ZMK_STUDIO_LOCKING=n

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_MAX_CONN=17
CONFIG_BT_MAX_PAIRED=17
